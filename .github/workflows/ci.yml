name: CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: npm
      - run: make install
      - run: make lint
      - run: make test
      - run: make build
